[project]
name = "wirejac-agent-graph"
version = "0.1.0"
description = "Jac-native WireJac agent graph and guarded ESP32 hardware service"
entry-point = "main.jac"
kind = "api-service"
jac-version = "==0.34.7"
requires-python = ">=3.12"

[dependencies]
esptool = "==5.3.1"
littlefs-python = "==0.18.0"
mpremote = "==1.28.0"
pyserial = "==3.5"
wokwi-client = "==0.4.0"

[dev-dependencies]
pytest = ">=8.4,<9"
pytest-asyncio = ">=1.1,<2"

[run]
main = true
cache = true
topology_index = true
diagnostics = "error"

[serve]
port = 8000
main = true

[scale.server]
host = "127.0.0.1"
docs_enabled = true

[scale.admin]
enabled = false

[scale.jwt]
secret = "${WIREJAC_JWT_SECRET:-wirejac-localhost-development-only}"

[test]
directory = "tests"
verbose = true
fail_fast = true

[build]
typecheck = true
dir = ".jac"

[check]
enforce_access = true

[check.lint]
select = ["default"]

[dev]
test_jobs = "1"

[scripts]
demo = "jac run main.jac --no-cache"
test = "jac test tests/wirejac.jac"
