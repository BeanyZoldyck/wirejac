[project]
name = "wirejac"
version = "0.1.0"
description = "Multi-agent CI/CD orchestrator — native Jaclang OSP"
entry-point = "main.jac"
kind = "fullstack"

[jacpack]
name = "wirejac-dashboard"
description = "WireJac mission-control dashboard for hardware CI/CD orchestration"
jaclang = "0.13.5"
plugins = [
  { name = "jac-client", version = "0.3.11" },
]

[jacpack.options]
files = [
  "*.jac",
  "components/**/*",
  "lib/**/*.jac",
  "styles/**/*",
  "assets/**/*",
  "vite.external-components.js",
  "image.png",
]
directories = ["assets", "components", "lib", "styles"]

[jac-shadcn]
style = "nova"
baseColor = "zinc"
theme = "orange"
font = "geist"
radius = "default"
menuAccent = "subtle"
menuColor = "default"
[dependencies.npm]
"@fontsource-variable/geist" = "*"
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.0.0"
react-hook-form = "^7.71.0"
zod = "^4.3.6"
"@hookform/resolvers" = "^5.2.2"
radix-ui = "*"
class-variance-authority = "*"
shadcn = "^3.8.5"
clsx = "^2.1.1"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"
"@fontsource-variable/elms-sans" = "latest"
"@xyflow/react" = "latest"
lucide-react = "latest"
framer-motion = "latest"
"@radix-ui/react-dialog" = "latest"
"@radix-ui/react-tooltip" = "latest"
"@hugeicons/react" = "latest"
"@hugeicons/core-free-icons" = "latest"
"@fontsource-variable/m-plus-1" = "latest"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"
tailwindcss = "latest"
"@tailwindcss/vite" = "latest"

[dev-dependencies]
watchdog = ">=3.0.0"

[byllm.model]
default_model = "${BYLLM_DEFAULT_MODEL:-openrouter/deepseek/deepseek-v4-flash}"

[serve]
base_route_app = "app"

[client.vite]
plugins = ["tailwindcss()", "wirejacExternalComponentDependencies()"]
lib_imports = [
  "import tailwindcss from '@tailwindcss/vite'",
  "import { wirejacExternalComponentDependencies } from '../../../vite.external-components.js'",
]

[client.app_meta_data]
title = "wirejac"
description = "Multi-agent CI/CD orchestrator — native Jaclang OSP"
theme_color = "#f97316"

[plugins.desktop]
name = "wirejac"
identifier = "dev.wirejac.app"
version = "0.1.0"

[plugins.desktop.window]
title = "wirejac"
width = 1280
height = 820
min_width = 1000
min_height = 700
resizable = true
