<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WireJac Motion Lab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div>
        <p class="eyebrow">WireJac Motion Lab</p>
        <h1>Snatch detection dataset</h1>
      </div>
      <div class="status"><span></span> ESP32 streaming</div>
    </header>

    <section class="metrics" aria-label="Collection summary">
      <article><strong id="sample-count">0</strong><span>active samples</span></article>
      <article><strong>100 Hz</strong><span>sample rate</span></article>
      <article><strong>training-001</strong><span>session</span></article>
    </section>

    <section class="chart-panel">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">Live acceleration</p>
          <h2>Three-axis signal</h2>
        </div>
        <div class="legend"><span class="x">X</span><span class="y">Y</span><span class="z">Z</span></div>
      </div>
      <canvas id="motion-chart" width="1000" height="360" aria-label="Live accelerometer chart"></canvas>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
